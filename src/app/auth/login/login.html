<div class="w-screen h-screen flex">
  <aside class="bg-red-800 w-1/2 h-full flex items-center justify-center">
    <div class="flex flex-col text-center items-center gap-2">
        <fa-icon [icon]="faMugHot" class="text-6xl text-white"></fa-icon>
      <h1 class="text-white text-3xl font-bold">Meu Cardápio</h1>
      <h2 class="text-white text-xl">Tenha o cardápio da sua loja favorita na palma das mãos</h2>
    </div>
  </aside>
  <section class="w-1/2 h-full">
    <form>
        <mat-form-field>
            <mat-label>E-mail</mat-label>
            <input matInput />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Senha</mat-label>
            <input matInput type="password"/>
        </mat-form-field>
    </form>
  </section>
</div>
