<div class="min-h-screen bg-gray-50 p-8">
  <div class="border border-gray-200 rounded-lg flex flex-col gap-6">
    <!-- Header -->
    <section class="bg-red-100 flex p-4 px-6 items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="p-4 bg-linear-to-r from-red-600 to-red-400 rounded-lg">
          <fa-icon [icon]="faAdd" class="text-white font-bold"></fa-icon>
        </div>
        <div>
          <h1 class="text-xl font-bold">Informações do Produto</h1>
          <h2 class="text-sm opacity-85">Preencha os detalhes abaixo</h2>
        </div>
      </div>
      <fa-icon [icon]="faClose"></fa-icon>
    </section>

    <div class="p-4">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <!-- Informações básicas -->
        <div class="flex gap-1 pb-4 items-center">
          <fa-icon [icon]="faInfoCircle" class="text-red-500" size="lg"></fa-icon>
          <h1 class="font-bold text-lg">Informação Básica</h1>
        </div>

        <section>
          <div class="flex flex-col md:flex-row w-full gap-4">
            <!-- Nome do Produto -->
            <div class="w-full md:w-1/2">
              <h1>Nome do Produto *</h1>
              <mat-form-field class="w-full" appearance="outline">
                <input matInput placeholder="ex.: Frango assado" formControlName="name" />

                <mat-error *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
                  Nome é obrigatório.
                </mat-error>
              </mat-form-field>
            </div>

            <!-- Categoria -->
            <div class="w-full md:w-1/2">
              <h1>Categoria *</h1>
              <mat-form-field class="w-full" appearance="outline">
                <input matInput placeholder="ex.: Assados" formControlName="category" />

                <mat-error *ngIf="form.get('category')?.touched && form.get('category')?.invalid">
                  Categoria é obrigatória.
                </mat-error>
              </mat-form-field>
            </div>
          </div>

          <div class="w-full">
            <h1>Descrição</h1>
            <mat-form-field class="w-full" appearance="outline">
              <textarea
                matInput
                placeholder="Descreva seu produto..."
                formControlName="description"
              ></textarea>
            </mat-form-field>
          </div>
        </section>

        <!-- Preço -->
        <div class="flex gap-1 pb-4 items-center">
          <fa-icon [icon]="faUsd" class="text-red-500" size="lg"></fa-icon>
          <h1 class="font-bold text-lg">Preço & Status</h1>
        </div>

        <section>
          <h1>Preço *</h1>
          <mat-form-field class="w-full" appearance="outline">
            <input
              matInput
              placeholder="R$ 0,00"
              (input)="onPriceInput($event)"
              formControlName="price"
            />

            <mat-error *ngIf="form.get('price')?.touched && form.get('price')?.invalid">
              Preço é obrigatório.
            </mat-error>
          </mat-form-field>
        </section>

        <!-- Imagem -->
        <div class="flex gap-1 pb-4 items-center">
          <fa-icon [icon]="faImage" class="text-red-500" size="lg"></fa-icon>
          <h1 class="font-bold text-lg">Imagem do Produto</h1>
        </div>

        <section class="flex flex-col gap-4">
          <div class="w-full border p-4">
            <input type="file" (change)="onFileSelected($event)" />
          </div>

          <!-- Preview -->
          @if (previewUrl) {
            <div class="flex justify-center">
              <img
                [src]="previewUrl"
                class="w-40 h-40 object-cover rounded-lg shadow"
                alt="Preview"
              />
            </div>
          }

          <div class="flex items-center gap-4">
            <h1>Status do Item</h1>
            <mat-slide-toggle formControlName="isActive"></mat-slide-toggle>
          </div>
        </section>

        <!-- BOTÃO LOADING -->
        <div class="w-full flex justify-end items-center mt-4">
          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="loading || form.invalid"
            class="flex items-center gap-2"
          >
            @if (!loading) {
              Adicionar Item
            } @else {
              <span
                class="animate-spin border-2 border-white border-t-transparent rounded-full w-5 h-5"
              ></span>
              Salvando...
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
