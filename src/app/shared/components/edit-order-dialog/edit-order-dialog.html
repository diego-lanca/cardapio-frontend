<div class="p-4">
  <h2 class="text-xl font-bold mb-4">Editar Pedido #{{ data.order.id }}</h2>

  <div class="space-y-3">
    <p class="text-sm text-gray-700">
      Cliente: <strong>{{ data.user.name }}</strong> (ID: {{ data.user.id }})
    </p>

    <label class="block text-sm font-medium text-gray-700">Status</label>
    <select [(ngModel)]="data.order.status" class="w-full border px-3 py-2 rounded-lg">
      @for (entry of statuses | keyvalue; track entry.key) {
        <option [value]="entry.key">
          {{ entry.value }}
        </option>
      }
    </select>
  </div>

  <div class="flex justify-end gap-3 mt-6">
    <button class="px-4 py-2 bg-gray-200 rounded-lg" (click)="close()">Cancelar</button>
    <button class="px-4 py-2 bg-red-600 text-white rounded-lg" (click)="save()">Salvar</button>
  </div>
</div>
