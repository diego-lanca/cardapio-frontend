<div class="relative">
  <!-- Botão Fechar -->
  <button
    mat-icon-button
    class="absolute top-2 right-2 z-10 bg-white/90 hover:bg-white rounded-full shadow-lg"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>

  <!-- Imagem do Produto -->
  <div
    class="relative h-64 bg-gradient-to-br overflow-hidden"
    [style.background-image]="
      'linear-gradient(to bottom right, ' + data.sectionColor + '40, ' + data.sectionColor + '60)'
    "
  >
    <div class="w-full h-full flex items-center justify-center">
      @if (!data.item.image_url) {
        <svg
          class="w-24 h-24 text-white opacity-50"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        </svg>
      } @else {
        <img [src]="data.item.image_url" [alt]="data.item.name" class="w-full h-full object-cover" />
      }
    </div>
  </div>

  <!-- Conteúdo do Dialog -->
  <div class="p-6">
    <!-- Título e Preço -->
    <div class="flex justify-between items-start mb-4">
      <h2 class="text-2xl font-bold text-gray-900 flex-1 pr-4">
        {{ data.item.name }}
      </h2>
      <span class="text-2xl font-bold text-red-600 whitespace-nowrap">
        {{ data.item.price | currency: 'BRL' }}
      </span>
    </div>

    <!-- Descrição -->
    <p class="text-gray-600 mb-6 leading-relaxed">
      {{ data.item.description || 'Sem descrição disponível.' }}
    </p>

    <!-- Controles de Quantidade -->
    <div class="bg-gray-50 rounded-lg p-4 mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-3"> Quantidade </label>
      <div class="flex items-center justify-center gap-4">
        <button
          (click)="decreaseQuantity()"
          [disabled]="quantity <= 1"
          class="w-10 h-10 rounded-full bg-white border-2 border-gray-300 hover:border-red-600 hover:bg-red-50 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:border-gray-300 disabled:hover:bg-white transition-all flex items-center justify-center"
        >
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
          </svg>
        </button>

        <div class="text-center min-w-[60px]">
          <span class="text-3xl font-bold text-gray-900">{{ quantity }}</span>
        </div>

        <button
          (click)="increaseQuantity()"
          class="w-10 h-10 rounded-full bg-white border-2 border-gray-300 hover:border-red-600 hover:bg-red-50 transition-all flex items-center justify-center"
        >
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Total -->
    <div class="bg-red-50 rounded-lg p-4 mb-6 border border-red-200">
      <div class="flex justify-between items-center">
        <span class="text-gray-700 font-medium">Total:</span>
        <span class="text-2xl font-bold text-red-600">
          {{ getTotal() | currency: 'BRL' }}
        </span>
      </div>
    </div>

    <!-- Botões de Ação -->
    <div class="flex gap-3">
      <button mat-stroked-button (click)="close()" class="flex-1">Cancelar</button>
      <button mat-raised-button color="warn" (click)="addToCart()" class="flex-1">
        <div class="flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
            />
          </svg>
          Adicionar ao Carrinho
        </div>
      </button>
    </div>
  </div>
</div>
