<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <!-- Logo e Nome -->
      <div class="flex items-center gap-3 cursor-pointer group">
        <div
          class="w-12 h-12 bg-gray-200 border-red-500 border rounded-full flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform"
        >
          <img src="/logos/mercio_logo_sem_fundo.png" alt="logo" style="transform: scale(0.9)" />
        </div>
        <h1
          class="text-2xl font-bold bg-gradient-to-r from-red-600 to-red-700 bg-clip-text text-transparent hidden sm:block"
        >
          Rotisseria do Mércio
        </h1>
      </div>

      <!-- Menu PC-->
      <div class="hidden md:flex items-center gap-6">
        <a
          [routerLink]="['/menu']"
          class="flex items-center gap-2 px-4 py-2 rounded-lg text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors font-medium"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
          Menu
        </a>

        <a
          [routerLink]="['/orders']"
          class="flex items-center gap-2 px-4 py-2 rounded-lg text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors font-medium"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
            />
          </svg>
          Pedidos
        </a>
      </div>

      <!-- Carrinho e Menu Mobile -->
      <div class="flex items-center gap-3">
        <!-- Busca Desktop -->
        <button
          class="hidden lg:flex items-center gap-2 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </button>

        <!-- Carrinho -->
        <button
          class="relative flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-4 sm:px-5 py-2.5 rounded-lg font-semibold shadow-md hover:shadow-lg transition-all"
          (click)="goToCart()"
          >
          <fa-icon [icon]="faCartShopping" [size]="'lg'"></fa-icon>
          <span class="hidden sm:inline">Carrinho</span>

          <!-- Badge de quantidade -->
          @if (cartItems() > 0) {
            <span
              class="absolute -top-2 -right-2 bg-orange-500 text-white text-xs font-bold min-w-6 h-6 px-1.5 flex items-center justify-center rounded-full border-2 border-white"
            >
              {{ cartItems() }}
            </span>
          }
        </button>

        <!-- Perfil / Login -->
        @if (!user()) {
          <!-- não logado -->
          <button
            class="hidden md:flex items-center gap-2 px-4 py-2 rounded-lg text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors font-medium"
            (click)="openLoginModal()"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.121 17.804A4 4 0 017 17h10a4 4 0 011.879.804M12 14a5 5 0 100-10 5 5 0 000 10z"
              />
            </svg>
            Login
          </button>
        } @else {
          <!-- Logado -->
          <div class="hidden md:flex items-center gap-3 cursor-pointer">
            <img
              [src]="user()?.avatar_url || '/default_avatar.png'"
              class="w-10 h-10 rounded-full border shadow-sm "
            />
            <span class="font-semibold text-gray-800">
              {{ getUserFirstName(user()?.full_name) }}
            </span>

            <button
              class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded-md shadow"
              (click)="logout()"
            >
              Sair
            </button>
          </div>
        }

        <!-- Botão Menu Mobile -->
        <button
          (click)="toggleMobileMenu()"
          class="md:hidden p-2 rounded-lg hover:bg-gray-100 text-gray-700 transition-colors"
        >
          @if (!isMobileMenuOpen) {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Menu Mobile -->
  @if (isMobileMenuOpen) {
    <div class="md:hidden border-t border-gray-200 bg-white animate-slideDown">
      <div class="px-4 py-3 space-y-1">
        @if (!user()) {
          <button
            (click)="openLoginModal(); toggleMobileMenu()"
            class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.121 17.804A4 4 0 017 17h10a4 4 0 011.879.804M12 14a5 5 0 100-10 5 5 0 000 10z"
              />
            </svg>
            Login
          </button>
        } @else {
          <div class="flex items-center gap-3 px-4 py-3">
            <img
              [src]="user()?.avatar_url || '/default_avatar.png'"
              class="w-12 h-12 rounded-full border"
            />
            <div class="flex flex-col">
              <span class="font-semibold text-gray-800">{{ getUserFirstName(user()?.full_name ) }}</span>
              <button
                class="text-red-600 text-sm mt-1 underline"
                (click)="logout(); toggleMobileMenu()"
              >
                Sair
              </button>
            </div>
          </div>
        }

        <a
          [routerLink]="['/menu']"
          (click)="toggleMobileMenu()"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
          Menu
        </a>

        <a
          [routerLink]="['/orders']"
          (click)="toggleMobileMenu()"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-red-50 hover:text-red-600 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
            />
          </svg>
          Pedidos
        </a>
      </div>
    </div>
  }
</nav>
